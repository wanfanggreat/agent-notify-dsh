# ============================================================================
# agent-notify-dsh — DSH bundle patch
# ============================================================================
# 本文件是插件的"挂载声明"。DSH 启动时按 bundle 层栈叠加各插件 patch，
# 这一条把一个 agent-notify entry 插入 profile 的配置树。
#
# 安装方式：
#   dsh plugin --profile web add agent-notify-dsh
# 本地开发安装：
#   dsh plugin --profile web add link:<本仓库绝对路径>
#
# 配置项见 README；patch 会整行替换 config 而非合并，所以这里只写非默认值。
# ============================================================================

- insert:
    - id: agent-notify-dsh
      name: agent-notify-dsh
