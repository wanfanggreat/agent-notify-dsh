name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      # lib/ is committed so a git-hosted install needs no build step. That
      # makes it possible to edit src/ and forget to rebuild, shipping an
      # artifact that no longer matches its source. Fail loudly instead.
      - name: Verify committed lib/ matches src/
        run: |
          npm run build
          if ! git diff --exit-code -- lib/; then
            echo "::error::lib/ is stale. Run 'npm run build' and commit the result."
            exit 1
          fi
